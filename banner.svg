<svg width="1200" height="320" viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&amp;family=Share+Tech+Mono&amp;display=swap');
      .glitchTop { font-family:'Orbitron',sans-serif; font-weight:900; font-size:64px; fill:#00E5FF; opacity:.55; }
      .glitchBot { font-family:'Orbitron',sans-serif; font-weight:900; font-size:64px; fill:#FF003C; opacity:.55; }
      .mainTitle { font-family:'Orbitron',sans-serif; font-weight:900; font-size:64px; fill:#F7E017; }
      .subTitle  { font-family:'Share Tech Mono',monospace; font-size:20px; fill:#8B8B93; letter-spacing:6px; }
      .hud       { font-family:'Share Tech Mono',monospace; font-size:13px; fill:#F7E017; letter-spacing:2px; }
      .hudDim    { font-family:'Share Tech Mono',monospace; font-size:13px; fill:#4a4a52; letter-spacing:2px; }
      .flicker   { animation: flick 4.2s infinite steps(1); }
      @keyframes flick {
        0%,92%,100% { opacity:1; }
        93% { opacity:.4; }
        94% { opacity:1; }
        95% { opacity:.3; }
        96% { opacity:1; }
      }
    </style>

    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A0A0F"/>
      <stop offset="100%" stop-color="#050506"/>
    </linearGradient>

    <radialGradient id="glowRed" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF003C" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#FF003C" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowYellow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F7E017" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#F7E017" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#050506" stop-opacity="1"/>
      <stop offset="15%" stop-color="#050506" stop-opacity="0"/>
      <stop offset="85%" stop-color="#050506" stop-opacity="0"/>
      <stop offset="100%" stop-color="#050506" stop-opacity="1"/>
    </linearGradient>

    <clipPath id="frame"><rect x="0" y="0" width="1200" height="320" rx="4"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="320" fill="url(#bg)"/>

    <!-- perspective street grid, converging toward a vanishing point -->
    <g stroke="#1c1c26" stroke-width="1">
      <line x1="600" y1="70" x2="-400" y2="320"/>
      <line x1="600" y1="70" x2="-100" y2="320"/>
      <line x1="600" y1="70" x2="200" y2="320"/>
      <line x1="600" y1="70" x2="500" y2="320"/>
      <line x1="600" y1="70" x2="700" y2="320"/>
      <line x1="600" y1="70" x2="1000" y2="320"/>
      <line x1="600" y1="70" x2="1300" y2="320"/>
      <line x1="600" y1="70" x2="1600" y2="320"/>
      <line x1="0" y1="230" x2="1200" y2="230" opacity=".5"/>
      <line x1="0" y1="270" x2="1200" y2="270" opacity=".35"/>
      <line x1="0" y1="310" x2="1200" y2="310" opacity=".2"/>
    </g>

    <rect width="1200" height="320" fill="url(#glowRed)" transform="translate(150,40)"/>
    <rect width="1200" height="320" fill="url(#glowYellow)" transform="translate(950,120)"/>

    <!-- AKIRA-style pill / capsule marker, top right, original geometry -->
    <g transform="translate(1040,60)" class="flicker">
      <circle r="46" fill="none" stroke="#FF003C" stroke-width="3"/>
      <circle r="46" fill="url(#glowRed)"/>
      <line x1="-46" y1="0" x2="46" y2="0" stroke="#FF003C" stroke-width="3"/>
      <text x="0" y="-8" text-anchor="middle" class="hud" fill="#FF003C">神威</text>
      <text x="0" y="20" text-anchor="middle" class="hud" fill="#FF003C" font-size="11">00734</text>
    </g>

    <!-- HUD corner brackets -->
    <g stroke="#F7E017" stroke-width="2" fill="none" opacity=".8">
      <path d="M20,20 L20,50 M20,20 L50,20"/>
      <path d="M1180,20 L1180,50 M1180,20 L1150,20"/>
      <path d="M20,300 L20,270 M20,300 L50,300"/>
      <path d="M1180,300 L1180,270 M1180,300 L1150,300"/>
    </g>
    <text x="40" y="34" class="hud">SYS // ONLINE</text>
    <text x="1080" y="296" text-anchor="end" class="hudDim">SECTOR: GDS-SABRE // GOIÁS-BR</text>

    <!-- glitch title stack -->
    <text x="97" y="164" class="glitchTop">MIQUÉIAS SOUZA</text>
    <text x="103" y="170" class="glitchBot">MIQUÉIAS SOUZA</text>
    <text x="100" y="167" class="mainTitle">MIQUÉIAS SOUZA</text>

    <text x="102" y="205" class="subTitle">DEV · ANALISTA · GDS/SABRE</text>

    <!-- bottom scan strip -->
    <rect x="0" y="300" width="1200" height="4" fill="#F7E017"/>
    <rect x="0" y="300" width="1200" height="4" fill="#F7E017" opacity=".4">
      <animate attributeName="x" values="-1200;1200" dur="3.5s" repeatCount="indefinite"/>
    </rect>

    <rect width="1200" height="320" fill="url(#fade)" opacity=".6"/>
  </g>
</svg>
