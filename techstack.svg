<svg width="1200" height="200" viewBox="0 0 1200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&amp;family=Orbitron:wght@700&amp;display=swap');
      .lbl   { font-family:'Orbitron',sans-serif; font-weight:700; font-size:12px; letter-spacing:3px; fill:#F7E017; }
      .item  { font-family:'Share Tech Mono',monospace; font-size:15px; fill:#E8E8E8; }
      .tag   { font-family:'Share Tech Mono',monospace; font-size:10px; fill:#6a6a72; }
      .chip  { fill:#0A0A0F; stroke:#2a2a34; stroke-width:1; }
      .chipHot { fill:#0A0A0F; stroke:#FF003C; stroke-width:1; }
    </style>
  </defs>

  <rect width="1200" height="200" fill="#050506"/>
  <line x1="0" y1="0" x2="1200" y2="0" stroke="#1c1c26" stroke-width="1"/>
  <text x="24" y="28" class="lbl">▓▓ STACK // RUNTIME</text>
  <line x1="24" y1="38" x2="1176" y2="38" stroke="#1c1c26" stroke-width="1"/>

  <!-- row 1: core languages -->
  <g transform="translate(24,55)">
    <rect class="chipHot" width="150" height="34" rx="2"/>
    <text x="14" y="22" class="item">C# / .NET</text>
    <rect class="chip" x="160" width="180" height="34" rx="2"/>
    <text x="174" y="22" class="item">XML / SOAP</text>
    <rect class="chip" x="350" width="130" height="34" rx="2"/>
    <text x="364" y="22" class="item">Python</text>
    <rect class="chip" x="490" width="160" height="34" rx="2"/>
    <text x="504" y="22" class="item">JavaScript</text>
  </g>

  <!-- row 2: infra -->
  <g transform="translate(24,100)">
    <rect class="chip" width="110" height="34" rx="2"/>
    <text x="14" y="22" class="item">Git</text>
    <rect class="chip" x="120" width="120" height="34" rx="2"/>
    <text x="134" y="22" class="item">TFS</text>
    <rect class="chipHot" x="250" width="190" height="34" rx="2"/>
    <text x="264" y="22" class="item">Sabre / GDS</text>
    <rect class="chip" x="450" width="140" height="34" rx="2"/>
    <text x="464" y="22" class="item">Docker</text>
  </g>

  <text x="24" y="180" class="tag">// TRAJETÓRIA EM ANDAMENTO: ENGENHARIA DE IA — MÓDULO EM CARREGAMENTO...</text>
  <rect x="24" y="188" width="1152" height="3" fill="#151519"/>
  <rect x="24" y="188" width="410" height="3" fill="#F7E017"/>
</svg>
